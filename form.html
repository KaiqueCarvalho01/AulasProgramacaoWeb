<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Formulário de Contato</title>
</head>

<body>
  <div class="navbar">
    <div class="logo"><img src="/img/logo/bike-icon.ico" alt="logo" /></div>
    <div class="menu">
      <a href="/index.html">Home</a>
      <a href="/motos.html">Motos</a>
      <a href="/form.html">Contato</a>
      <a href="/tabela.html">Preços</a>
    </div>
  </div>

  <section class="contato-container">
    <div class="contato-card">
      <h1 id="h1-form">Fale Conosco</h1>
      <p>Tem alguma dúvida sobre os modelos ou preços? Envie uma mensagem.</p>

      <form action="submit_form.php" method="post" class="form-flex">
        <div class="input-group">
          <label for="name">Nome:</label>
          <input type="text" id="name" name="name" placeholder="Seu nome completo" required>
        </div>

        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label for="message">Mensagem:</label>
          <textarea id="message" name="message" rows="5" placeholder="Como podemos ajudar?" required></textarea>
        </div>

        <div class="form-buttons">
          <input type="reset" value="Limpar" class="botao-reset">
          <input type="submit" value="Enviar Mensagem" class="botao-enviar">
        </div>
      </form>
    </div>
  </section>
</body>

</html>
